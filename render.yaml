# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — creates the web service and its PostgreSQL database.
#
# Deploy:  Render dashboard → New → Blueprint → pick this repo.
#
# Everything marked `sync: false` is prompted for once at deploy time and never
# stored in the repo. The three secrets are generated by Render itself, so no
# key is ever typed, pasted or committed.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: kursia-db
    databaseName: kursia
    user: kursia
    # `free` works for a trial but Render expires free databases; move to
    # `starter` before real users, or you will lose every purchase record.
    plan: starter

services:
  - type: web
    name: kursia
    runtime: node
    plan: starter
    region: frankfurt # closest Render region to Georgia
    branch: main
    healthCheckPath: /api/health

    buildCommand: npm ci && npm run build
    # Runs after the build, before the new instance takes traffic: applies
    # migrations and ensures settings/categories/admin exist. Idempotent.
    preDeployCommand: npm run release
    startCommand: npm run start

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # ── Database ────────────────────────────────────────────────────────
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: kursia-db
          property: connectionString

      # ── Secrets — generated by Render, never seen by anyone ─────────────
      - key: AUTH_SECRET
        generateValue: true
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: CERTIFICATE_SIGNING_SECRET
        generateValue: true

      # ── URLs ────────────────────────────────────────────────────────────
      # Render injects its own hostname; replace both with your real domain
      # once DNS is pointed, or canonical URLs and email links will use
      # onrender.com.
      - key: APP_URL
        fromService:
          type: web
          name: kursia
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: kursia
          envVarKey: RENDER_EXTERNAL_URL

      # ── Storage ─────────────────────────────────────────────────────────
      # Render's disk is EPHEMERAL: anything written locally is destroyed on
      # every deploy and restart. Uploaded thumbnails, PDFs and video MUST go
      # to object storage. Cloudflare R2 is the cheapest option here (no
      # egress fees) and speaks the S3 API the storage driver already uses.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: IMAGE_REMOTE_HOSTS
        sync: false

      # ── Video ───────────────────────────────────────────────────────────
      # Leave as `storage` only for a first smoke test. Self-hosted MP4 served
      # through the app will not survive real concurrency — switch to `bunny`
      # before launch.
      - key: VIDEO_DRIVER
        value: storage
      - key: BUNNY_STREAM_LIBRARY_ID
        sync: false
      - key: BUNNY_STREAM_API_KEY
        sync: false
      - key: BUNNY_STREAM_CDN_HOSTNAME
        sync: false
      - key: BUNNY_TOKEN_AUTH_KEY
        sync: false

      # ── Payments ────────────────────────────────────────────────────────
      # `manual` (bank transfer) works with no credentials, so the platform is
      # usable from day one. Add `bog` / `tbc` once the bank issues your keys.
      - key: PAYMENT_PROVIDERS
        value: manual
      - key: PAYMENT_DEFAULT_PROVIDER
        value: manual
      - key: PAYMENT_SANDBOX_ENABLED
        value: "false"
      - key: BOG_CLIENT_ID
        sync: false
      - key: BOG_CLIENT_SECRET
        sync: false
      - key: BOG_PUBLIC_KEY
        sync: false
      - key: TBC_API_KEY
        sync: false
      - key: TBC_CLIENT_ID
        sync: false
      - key: TBC_CLIENT_SECRET
        sync: false
      - key: TBC_WEBHOOK_SECRET
        sync: false

      # ── Email ───────────────────────────────────────────────────────────
      # `log` only prints to the server log — verification emails and receipts
      # will not reach anyone. Set `resend` and a key before launch.
      - key: EMAIL_DRIVER
        value: log
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # ── Commerce ────────────────────────────────────────────────────────
      # All of these are also editable at runtime in Admin → Settings.
      - key: DEFAULT_CURRENCY
        value: GEL
      - key: DEFAULT_COMMISSION_BPS
        value: "1000" # 10%
      - key: PAYOUT_CLEARING_DAYS
        value: "14"
      - key: PAYOUT_MINIMUM_MINOR
        value: "5000" # ₾50.00
      - key: REFUND_WINDOW_DAYS
        value: "14"

      # ── Branding ────────────────────────────────────────────────────────
      - key: PLATFORM_NAME
        value: Kursia
      - key: PLATFORM_NAME_KA
        value: კურსია
      - key: PLATFORM_SUPPORT_EMAIL
        sync: false

      # ── Security ────────────────────────────────────────────────────────
      # Render terminates TLS at its proxy, so X-Forwarded-For is trustworthy
      # and rate limiting must read it to see real client IPs.
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"

      # ── First administrator ─────────────────────────────────────────────
      # Used once by `npm run release`. Change the password after first login;
      # re-running will not overwrite it.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

    autoDeploy: true

  # ── Scheduled maintenance ─────────────────────────────────────────────────
  # Drains the email outbox, moves cleared sales from pending to withdrawable,
  # prunes expired sessions. WITHOUT THIS, creators can never withdraw their
  # earnings and no transactional email is ever delivered.
  #
  # Render cron is a paid feature; on a plan without it, any external scheduler
  # (cron-job.org, GitHub Actions) hitting the same URL with the same header
  # does the identical job.
  - type: cron
    name: kursia-cron
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    schedule: "*/10 * * * *"
    buildCommand: "echo no build step needed"
    startCommand: >
      node -e "fetch(process.env.APP_URL+'/api/cron',{method:'POST',headers:{Authorization:'Bearer '+process.env.AUTH_SECRET}}).then(async r=>{console.log(r.status,await r.text());process.exit(r.ok?0:1)}).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: APP_URL
        fromService:
          type: web
          name: kursia
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_SECRET
        fromService:
          type: web
          name: kursia
          envVarKey: AUTH_SECRET
